# 안드로이드 신호 로거: 빌드 + 단위 테스트 + "인터넷 권한 없음" 검사 + APK 업로드
name: Android build
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Verify the app declares no INTERNET permission
        run: |
          M=$(find app/build -name AndroidManifest.xml -path '*merged_manifest*' | head -1)
          echo "manifest: $M"
          test -n "$M"
          grep -c "uses-permission" "$M"
          if grep -q "android.permission.INTERNET" "$M"; then echo "FAIL: INTERNET permission present"; exit 1; fi
          echo "OK: no INTERNET permission"
      - uses: actions/upload-artifact@v4
        with:
          name: signal-logger-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
